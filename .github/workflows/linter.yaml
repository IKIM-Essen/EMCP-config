name: Lint Code Base

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: Lint Code Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lint ansible project
        uses: ansible/ansible-lint@v25
        with:
          args: --skip-list yaml[line-length]
